<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Editec Experience AR</title>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
        AFRAME.registerComponent("fase-1",{
                init:function(){
                    const target=this.el;
                    target.addEventListener("targetFound",()=>{
                        const elementos=target.querySelectorAll(".elemento");
                        elementos.forEach((elemento,i)=>{
                            setTimeout(()=>{
                                elemento.setAttribute("visible",true);
                                elemento.emit("aparecer");
                            },1800+i*80);
                        });
                    });
                    target.addEventListener("targetLost",()=>{
                        const elementos=target.querySelectorAll(".elemento");
                        elementos.forEach(elemento=>{
                            elemento.setAttribute("visible",false);
                        });
                    });
                }
            });
    </script>
</head>

        vr-mode-ui="enabled: false"
